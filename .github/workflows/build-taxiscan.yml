name: Build TaxiScan project ZIP
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: unzip -q TaxiScanPlay_FIXED.zip -d source
      - name: Build debug APK
        run: cd source/TaxiScanPlay && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TaxiScan-debug-apk
          path: source/TaxiScanPlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
