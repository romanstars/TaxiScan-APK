name: TaxiScan 2.0 APK

on:
  push:
    branches: [ main ]
    paths:
      - 'TaxiScanV2/**'
      - '.github/workflows/build-taxiscan-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build TaxiScan 2.0
        run: gradle -p TaxiScanV2 :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TaxiScan-v2-debug-apk
          path: TaxiScanV2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
